name: roundtable_agent_runner
description: Outbound daemon that registers a machine with the roundtable server and reports a heartbeat. Installed as the agent-runner systemd service (see scripts/install-agent.sh).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  roundtable_client:
    path: ../roundtable_client
  synchronized: ^3.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
