services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: roundtable
      POSTGRES_PASSWORD: "U2BM0OXr9MV_PIFWkBxSGmAwb0RfVG9E"
    volumes:
      - roundtable_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "KPE8Jv_D2iSBGx5WcqTtQhzNqPqT9wjr"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: roundtable_test
      POSTGRES_PASSWORD: "GuOWWc4cF8F6deYcZTs5QJjZAwo5Psc8"
    volumes:
      - roundtable_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "LecIG8-IsVicL5suY8Sb4SRb0ipFzSog"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  roundtable_data:
  roundtable_test_data:
