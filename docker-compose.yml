# One-command demo: Postgres, the server (which also serves the panel) and
# a demo machine running the agent runner. See README.md.
#
#   docker compose up --build
#
# Then open http://localhost:8082, set the machine's Claude token
# (Machines → ⋯ → Set Claude token), add an agent and a project, and create
# a task.
#
# The passwords below are fixed demo values for a local, throwaway setup.
# The ports are published on 127.0.0.1 only: the panel has no login yet
# (docs/KNOWN-ISSUES.md), so anyone who reaches it controls the agents.
x-demo-passwords: &demo-passwords
  SERVERPOD_DATABASE_PASSWORD: yr7LCmHyXHT9uLhMfWE7t6DLmvLhmTVKqtpED8Uf
  SERVERPOD_SERVICE_SECRET: AtnDAK2Vy1N8Zn2ySVUnNOShdq8Bvyu00tYiMVGo
  SERVERPOD_PASSWORD_emailSecretHashPepper: QUesBVefDnug0o0nBKCdIV0bWhkHh015MJfUk2GZ
  SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: 2hWRCewdYCiootsS8GK4HuHNqiwP7q82sOnPuBM85iAFdIFKzcWe3mUadIqz4YFGrqlGUEMaDi7DUua4
  SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: LjhU3RDT3kwhBI5f2b2WlT6BfVslhz3qXhuZf3v1

services:
  postgres:
    image: ghcr.io/serverpod/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: serverpod
      POSTGRES_PASSWORD: yr7LCmHyXHT9uLhMfWE7t6DLmvLhmTVKqtpED8Uf
    volumes:
      - roundtable_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: roundtable_server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *demo-passwords
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      SERVERPOD_APPLY_MIGRATIONS: "true"
      # URLs the browser (panel) and the install command use.
      SERVERPOD_API_SERVER_PUBLIC_HOST: localhost
      SERVERPOD_API_SERVER_PUBLIC_PORT: "8080"
      SERVERPOD_API_SERVER_PUBLIC_SCHEME: http
      SERVERPOD_INSIGHTS_SERVER_PUBLIC_HOST: localhost
      SERVERPOD_INSIGHTS_SERVER_PUBLIC_PORT: "8081"
      SERVERPOD_INSIGHTS_SERVER_PUBLIC_SCHEME: http
      SERVERPOD_WEB_SERVER_PUBLIC_HOST: localhost
      SERVERPOD_WEB_SERVER_PUBLIC_PORT: "8082"
      SERVERPOD_WEB_SERVER_PUBLIC_SCHEME: http
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"

  # A machine for agents, so the demo needs no VPS. It adds itself to the
  # server on first start; its Claude token is set in the panel.
  machine:
    build:
      context: .
      dockerfile: roundtable_server/Dockerfile
      target: machine
    restart: unless-stopped
    depends_on:
      - server
    hostname: demo-machine
    environment:
      SERVER_URL: http://server:8080/
      MACHINE_NAME: demo-machine
    volumes:
      - roundtable_machine_home:/home/agent

volumes:
  roundtable_postgres_data:
  roundtable_machine_home:
