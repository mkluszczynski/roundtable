### A clarifying question raised by the agent during plan mode (AskUserQuestion), awaiting an answer
### from the dev.
class: TaskQuestion
table: task_question
fields:
  ### onDelete=Cascade: questions have no meaning independent of their task.
  task: Task?, relation(name=task_questions, onDelete=Cascade)
  question: String
  options: List<String>
  answer: String?
  answeredAt: DateTime?
  createdAt: DateTime, default=now
