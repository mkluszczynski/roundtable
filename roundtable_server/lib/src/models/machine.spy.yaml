### A registered host (laptop, VPS) running the agent daemon. Pure infrastructure — an Agent is the
### persona living on it.
class: Machine
table: machine
fields:
  ### The machine's display name.
  name: String
  ### Hash of the machine's registration token. The raw token is shown to the dev only once.
  tokenHash: String?, scope=serverOnly
  status: MachineStatus, default=offline
  ### Last time a heartbeat was received from this machine's daemon.
  lastSeenAt: DateTime?
  createdAt: DateTime, default=now
  agents: List<Agent>?, relation(name=machine_agents)
  metrics: List<MachineMetric>?, relation(name=machine_metrics)
indexes:
  machine_token_hash_idx:
    fields: tokenHash
    unique: true
