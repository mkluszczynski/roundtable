### A message from the dev to the agent within the same session — the phase field distinguishes plan
### feedback from post-PR review feedback in the history.
class: TaskFeedback
table: task_feedback
fields:
  ### onDelete=Cascade: feedback has no meaning independent of its task.
  task: Task?, relation(name=task_feedback, onDelete=Cascade)
  message: String
  phase: TaskFeedbackPhase
  ### Null for plan feedback and rows from before kinds existed (the dev's).
  kind: TaskFeedbackKind?
  createdAt: DateTime, default=now
indexes:
  task_feedback_task_created_idx:
    fields: taskId, createdAt
